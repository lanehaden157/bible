name: Rebuild hub

# Rebuilds this site from the pushed code of bible-core and every started
# book (tools/hub_build.py), and commits only when something changed.
# Daily, plus a "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-hub
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
      - uses: actions/checkout@v4
        with:
          repository: lanehaden157/bible-core
          path: bible-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every started book, from bible-core's canon/books.json, so this file
      # never names a book (tools/new_book.py adds a new book's row). A row
      # with a `site` and a `repo` is cloned from the GitHub repo its Pages
      # URL names (https://<owner>.github.io/<repo-slug>/: numbers, joshua,
      # Matthew) into the folder `repo` names (Numbers, Joshua, Matthew),
      # beside bible-core, where hub_build.py looks for it.
      - name: Clone the started books
        run: |
          python - <<'EOF'
          import json, subprocess
          for b in json.load(open("bible-core/canon/books.json", encoding="utf-8"))["books"]:
              if not (b.get("site") and b.get("repo")):
                  continue
              owner, rest = b["site"].removeprefix("https://").split(".github.io/")
              url = f"https://github.com/{owner}/{rest.strip('/')}.git"
              print(f"{b['name']}: {url} -> {b['repo']}/", flush=True)
              subprocess.run(["git", "clone", "-q", "--depth", "1", url, b["repo"]], check=True)
          EOF
      - name: Build
        working-directory: bible-core
        run: python tools/hub_build.py ../hub
      - name: Commit and push if changed
        working-directory: hub
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Hub already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild hub from bible-core $(git -C ../bible-core rev-parse --short HEAD)"
          git push
